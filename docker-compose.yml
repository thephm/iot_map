services:

  iot_map:
    build: .
    ports:
      - "3030:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      # Fixed, not ${MONGODB_URI:-...}: Compose fills that from .env, which holds the Atlas URI.
      - MONGODB_URI=mongodb://mongo:27017/iotmap
      - MONGODB_ENVIRONMENT=${MONGODB_ENVIRONMENT:-development}
      - SHOW_PRODUCT_URLS=${SHOW_PRODUCT_URLS:-false}
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  mongodata:
