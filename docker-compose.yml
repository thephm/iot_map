services:

  iot_map:
    build: .
    ports:
      - "3030:3000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/iotmap}
      - SHOW_PRODUCT_URLS=${SHOW_PRODUCT_URLS:-false}
      - DEBUG=express:*
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  mongodata:
